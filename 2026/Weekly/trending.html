<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trending Players -- DTFFL Weekly</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#0f172a;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-bottom:40px;}
.hdr{padding:18px 16px 12px;border-bottom:1px solid #1e293b;}
.hdr h1{font-size:20px;font-weight:800;color:#f8fafc;}
.hdr p{font-size:12px;color:#64748b;margin-top:4px;}
.controls{display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid #1e293b;}
select{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:8px 10px;font-size:13px;}
.tabs{display:flex;gap:6px;padding:10px 16px 0;flex-wrap:wrap;}
.tab-btn{background:#1e293b;color:#94a3b8;border:1px solid #334155;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;}
.tab-btn.active{background:#4ade80;color:#0f172a;border-color:#4ade80;}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;}
th{position:sticky;top:0;background:#1e293b;color:#94a3b8;text-align:left;padding:8px 10px;cursor:pointer;white-space:nowrap;border-bottom:1px solid #334155;}
th:hover{color:#f8fafc;}
td{padding:7px 10px;border-bottom:1px solid #1e293b;white-space:nowrap;}
tr:hover td{background:#1e293b;}
.bombers-row td{background:#26344a;}
.bombers-row:hover td{background:#334155;}
.wrap{overflow-x:auto;padding:0 8px;}
.badge-yes{color:#4ade80;font-weight:700;}
.badge-no{color:#64748b;}
.badge-inj{color:#fb923c;font-weight:700;}
.badge-red{color:#f87171;font-weight:700;}
.footer{padding:20px 16px 0;font-size:11px;color:#334155;text-align:center;}

.tier-info{margin:12px 16px 4px;background:#1e293b;border:1px solid #334155;border-radius:10px;}
.tier-info summary{padding:12px 14px;cursor:pointer;font-weight:700;color:#f1f5f9;font-size:13px;list-style:none;}
.tier-info summary::-webkit-details-marker{display:none;}
.tier-info-body{padding:0 14px 14px;font-size:12px;color:#94a3b8;line-height:1.65;}
.tier-info-body ul{margin:6px 0 6px 18px;}
.tier-summary-line{padding:10px 16px 0;font-size:12px;color:#94a3b8;display:flex;gap:16px;flex-wrap:wrap;}
.tier-summary-line b{color:#e2e8f0;}
.tier-row{display:flex;align-items:stretch;margin:10px 16px;border-radius:10px;overflow:hidden;border:1px solid #334155;}
.tier-label{flex:0 0 60px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#0f172a;}
.tier-players{flex:1;display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:#1e293b;align-content:flex-start;}
.tier-empty-msg{color:#475569;font-size:12px;padding:10px;font-style:italic;}
.player-chip{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:6px 9px;font-size:11px;min-width:140px;}
.player-chip.bombers{border-color:#4ade80;}
.player-chip.freeagent{border-color:#38bdf8;}
.player-chip .pname{font-weight:700;color:#f1f5f9;display:block;font-size:12px;}
.player-chip .pmeta{color:#64748b;font-size:10px;margin-top:2px;display:block;}
.injury-badge{display:inline-block;margin-left:5px;padding:1px 5px;border-radius:5px;font-size:9px;font-weight:800;color:#0f172a;}
.injury-badge.q{background:#facc15;}
.injury-badge.d{background:#fb923c;}
.tier-more-btn{background:#0f172a;border:1px dashed #334155;border-radius:8px;padding:6px 9px;font-size:11px;color:#94a3b8;cursor:pointer;min-width:140px;}
@media (max-width:640px){
  .tier-row{flex-direction:column;margin:8px 10px;}
  .tier-label{flex:0 0 auto;padding:6px;font-size:16px;}
}

.tr-label{flex:0 0 96px;flex-direction:column;gap:2px;text-align:center;padding:6px 4px;}
.tr-num{font-size:24px;font-weight:900;line-height:1;}
.tr-name{font-size:11px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;}
.tr-rng{font-size:9px;font-weight:600;opacity:.75;}
.tr-chip{min-width:176px;}
.tr-chip .up{color:#4ade80;} .tr-chip .dn{color:#f87171;}
.tr-chip svg{display:block;margin-top:4px;}
.td-badge{display:inline-block;margin-left:5px;padding:1px 5px;border-radius:5px;font-size:9px;font-weight:800;color:#0f172a;background:#c084fc;}
.tr-note{padding:10px 16px 0;font-size:12px;color:#fb923c;}
@media (max-width:640px){
  .tr-label{flex:0 0 auto;flex-direction:row;gap:10px;justify-content:flex-start;padding:6px 12px;}
}
</style></head><body>
<div class="hdr">
  <h1>Trending Players (Wk7)</h1>
  <p>Who is moving up or down, not just who scored last week -- recency-weighted, bye-excused, tiered by machine learning.</p>
  <p id="genLabel" style="margin-top:6px;color:#334155;"></p>
</div>
<details class="tier-info">
  <summary>How Trending Works</summary>
  <div class="tier-info-body" id="trInfo"></div>
</details>
<div class="controls">
  <select id="trFilter">
    <option value="ALL">All Players</option>
    <option value="AVAILABLE">Available (No Team)</option>
    <option value="BOMBERS">Brandon's Bombers</option>
    <option value="BOMBERS_ALL">Bombers + Available</option>
    <option value="WATCHLIST">Watchlist</option>
  </select>
</div>
<div class="tabs"><button class="tab-btn" data-tab="QB" onclick="switchTrTab('QB')">QB</button><button class="tab-btn" data-tab="RB" onclick="switchTrTab('RB')">RB</button><button class="tab-btn" data-tab="WRTE" onclick="switchTrTab('WRTE')">WR/TE</button><button class="tab-btn active" data-tab="FLEX" onclick="switchTrTab('FLEX')">FLEX</button></div>
<div id="trNote" class="tr-note"></div>
<div id="trSummary" class="tier-summary-line"></div>
<div id="trRows"></div>
<div class="footer">DTFFL Analytics - Toledo scoring - nflverse-supplemented weekly stats</div>
<script>
const BOMBERS_TEAM_NAME = "Brandon's Bombers";
let TR_RAW = null, trTab = "FLEX", trFilter = 'ALL';

function sgn(v, nd) {
  if (v === null || v === undefined) return '--';
  return (v > 0 ? '+' : '') + v;
}

function sparkSvg(vals, up) {
  const W = 92, H = 26, pad = 3;
  const nums = (vals || []).filter(v => v !== null && v !== undefined);
  if (nums.length < 2) return '';
  const lo = Math.min(...nums), hi = Math.max(...nums), span = (hi - lo) || 1;
  const n = vals.length, dx = (W - 2 * pad) / Math.max(1, n - 1);
  const X = i => pad + i * dx, Y = v => H - pad - ((v - lo) / span) * (H - 2 * pad - 3);
  let path = '', pen = false, ticks = '', lastI = -1;
  vals.forEach((v, i) => {
    if (v === null || v === undefined) {
      pen = false;
      ticks += '<line x1="' + X(i).toFixed(1) + '" x2="' + X(i).toFixed(1) + '" y1="' + (H - 1) + '" y2="' + (H - 5) + '" stroke="#475569" stroke-width="1"/>';
      return;
    }
    path += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
    pen = true; lastI = i;
  });
  const col = up ? '#4ade80' : '#f87171';
  const dot = lastI >= 0 ? '<circle cx="' + X(lastI).toFixed(1) + '" cy="' + Y(vals[lastI]).toFixed(1) + '" r="2.2" fill="' + col + '"/>' : '';
  return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">' + ticks
    + '<path d="' + path + '" fill="none" stroke="' + col + '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>' + dot + '</svg>';
}

function trChip(p) {
  let cls = '';
  if (p.FantasyTeam === BOMBERS_TEAM_NAME) cls = ' bombers';
  else if (p.Available === true) cls = ' freeagent';
  const badges = (p.Injury_Flag ? '<span class="injury-badge ' + p.Injury_Flag.toLowerCase() + '">' + p.Injury_Flag + '</span>' : '')
    + (p.TD_Driven ? '<span class="td-badge" title="Rise leans on touchdowns">TD</span>' : '');
  const up = (p.Trend_Z ?? 0) >= 0;
  const exc = p.Excused_Wks ? ' (' + p.Excused_Wks + ' excused)' : '';
  const exp = (p.Exp_Delta !== null && p.Exp_Delta !== undefined) ? ' | exp ' + sgn(p.Exp_Delta) + ' pts' : '';
  return '<div class="player-chip tr-chip' + cls + '">'
    + '<span class="pname">#' + p.Rank + ' ' + p.Player + badges + '</span>'
    + '<span class="pmeta">' + p.Pos + (p.Team ? ' - ' + p.Team : '') + ' | ' + p.Games + ' gm' + exc + '</span>'
    + '<span class="pmeta">Recent ' + (p.Recent_PPG ?? '--') + ' | Szn ' + (p.Season_PPG ?? '--')
    + ' | <b class="' + ((p.PPG_Delta ?? 0) >= 0 ? 'up' : 'dn') + '">' + sgn(p.PPG_Delta) + '</b></span>'
    + '<span class="pmeta">Usage ' + sgn(p.Opp_Delta) + ' opp/g | Slope ' + sgn(p.Slope) + '/wk</span>'
    + '<span class="pmeta">Trend z ' + sgn(p.Trend_Z) + exp + '</span>'
    + sparkSvg(p.Spark, up)
    + '</div>';
}

function trKeep(p, wl) {
  switch (trFilter) {
    case 'AVAILABLE':   return p.Available === true;
    case 'BOMBERS':     return p.FantasyTeam === BOMBERS_TEAM_NAME;
    case 'BOMBERS_ALL': return p.Available === true || p.FantasyTeam === BOMBERS_TEAM_NAME;
    case 'WATCHLIST':   return wl.has(p.Player + '|' + p.Pos);
    default:            return true;
  }
}

function switchTrTab(tab) {
  trTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderTrending();
}

function renderTrending() {
  if (!TR_RAW) return;
  const tab = TR_RAW.tabs[trTab];
  if (!tab) return;
  const wl = new Set((TR_RAW.watchlist || []).map(w => w.Player + '|' + w.Pos));
  let shown = 0;
  const rows = (tab.tier_meta || []).map(m => {
    const players = (tab.tiers[String(m.id)] || []).filter(p => trKeep(p, wl));
    shown += players.length;
    if (trFilter !== 'ALL' && players.length === 0) return '';
    const rng = (m.min_z === m.max_z) ? sgn(m.min_z) : sgn(m.min_z) + ' to ' + sgn(m.max_z);
    const body = players.length ? players.map(trChip).join('') : '<div class="tier-empty-msg">No players in this tier</div>';
    return '<div class="tier-row">'
      + '<div class="tier-label tr-label" style="background:' + m.color + '">'
      + '<span class="tr-num">' + m.id + '</span><span class="tr-name">' + m.name + '</span>'
      + '<span class="tr-rng">z ' + rng + '</span></div>'
      + '<div class="tier-players">' + body + '</div></div>';
  }).join('');
  document.getElementById('trRows').innerHTML = rows || '<div class="tier-empty-msg" style="padding:16px">No players match this filter.</div>';
  const s = tab.summary;
  document.getElementById('trSummary').innerHTML =
    '<span>Players in pool: <b>' + s.players + '</b></span>'
    + '<span>Showing: <b>' + shown + '</b></span>'
    + '<span>Tiers chosen by ML: <b>' + s.k + '</b></span>'
    + '<span>Silhouette: <b>' + (s.silhouette ?? '--') + '</b></span>';
}

function renderTrInfo() {
  const m = TR_RAW.tabs.model;
  if (!m) return;
  const w = m.weights_pct || {};
  const labels = {form_delta: 'recent PPG vs season PPG', slope: 'weekly slope', opp_delta: 'usage (opportunity) trend', snap_delta: 'snap % trend'};
  const wtxt = Object.keys(labels).map(k => labels[k] + ' <b>' + (w[k] ?? 0) + '%</b>').join(' &middot; ');
  const fitted = m.calibrated
    ? 'Weights were <b>fitted from this season\'s game-to-game results</b> (' + m.n_train + ' player-weeks, non-negative least squares) - nothing hand-picked.'
    : '<b>Default weights</b> - not enough games yet to fit them from the data (' + m.n_train + ' player-weeks).';
  const oos = (m.wf_model !== null && m.wf_model !== undefined)
    ? '<li>Out-of-sample check (' + m.wf_folds + ' week(s), fit on earlier weeks only): rank correlation with next-game deviation <b>' + m.wf_model + '</b>'
      + (m.wf_form_only !== null && m.wf_form_only !== undefined ? ' vs <b>' + m.wf_form_only + '</b> for recent-form alone' : '') + '.</li>'
    : '';
  document.getElementById('trInfo').innerHTML =
    '<ul>'
    + '<li><b>Recent weeks count more.</b> Every game is weighted by age with a half-life of ' + m.half_life + ' weeks (a game that old counts half as much as last week).</li>'
    + '<li><b>Byes are excused</b> - the week is removed, not scored as a 0' + (m.inactive_excused ? ', and so are inactive/DNP weeks (no snaps, no opportunities)' : '') + '. Players need ' + m.min_games + '+ played games. Gaps show as small ticks under the sparkline.</li>'
    + '<li><b>It is a trend, not a hot streak.</b> Four signals are blended: ' + wtxt + '. ' + fitted + '</li>'
    + oos
    + '<li><b>Trend z</b>: 0 = typical movement for the position, +1 = one standard deviation more positive. <b>Exp</b> = expected next-game points vs his own season average (only when weights are fitted).</li>'
    + '<li><b>Tiers are found by the data</b>, not S-F: 1-D K-Means on Trend z, with the number of tiers (' + m.k_range[0] + '-' + m.k_range[1] + ') picked by silhouette score - so it can differ by tab and by week. Names come from where each tier sits.</li>'
    + '<li>Sparkline = weekly Toledo points. <span class="td-badge" style="margin-left:0">TD</span> = rising player whose recent points are ' + Math.round(m.td_driven_share * 100) + '%+ touchdowns (less sticky). Out/IR/PUP/Suspended players are hidden; Q/D keep a badge.</li>'
    + '<li>Green border = Brandon\'s Bombers, blue border = free agent, from this week\'s actual ownership.</li>'
    + '</ul>';
  if (m.note) {
    document.getElementById('trNote').textContent = 'Note: ' + m.note;
  }
}

async function initTrending(jsonPath) {
  const res = await fetch(jsonPath);
  TR_RAW = await res.json();
  document.getElementById('trFilter').addEventListener('change', e => { trFilter = e.target.value; renderTrending(); });
  document.getElementById('genLabel').textContent =
    'Season ' + TR_RAW.season + ' - Through Week ' + TR_RAW.through_week + ' - Updated ' + TR_RAW.generated;
  renderTrInfo();
  renderTrending();
}

initTrending('data/trending.json');
</script>
</body></html>
