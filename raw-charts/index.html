<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Raw Charts — DTFFL</title>
<style>

:root {
  --bg: #0f1115;
  --bg-card: #171a21;
  --bg-card-hover: #1d212a;
  --border: #2a2e38;
  --text: #e8eaed;
  --text-dim: #9aa0ab;
  --accent: #4ade80;      /* green — favors left/giving side */
  --accent2: #fb923c;     /* orange — favors right/other side */
  --accent-neutral: #60a5fa;
  --danger: #f87171;
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  padding-bottom: 100px; /* room for fixed footer nav */
}
a { color: inherit; }
.backlink {
  display: inline-block;
  padding: 14px 16px 0;
  color: var(--text-dim);
  text-decoration: none;
  font-size: 0.85rem;
}
header.hero { text-align: center; padding: 20px 16px 14px; }
header.hero h1 { margin: 0 0 6px; font-size: 1.7rem; }
header.hero p { margin: 0; color: var(--text-dim); font-size: 0.9rem; }
main { max-width: 980px; margin: 0 auto; padding: 0 14px 32px; }
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 20px;
}
label {
  display: block;
  font-size: 0.78rem;
  color: var(--text-dim);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
select, input[type="text"], input[type="number"] {
  width: 100%;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 12px;
  font-size: 1rem; /* >=16px avoids iOS auto-zoom on focus */
}
button {
  min-height: 46px;
  border-radius: 10px;
  border: none;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
}
button.primary-btn {
  background: var(--accent-neutral);
  color: #0b1220;
  width: 100%;
  padding: 13px 20px;
}
button.primary-btn:hover { opacity: 0.88; }
button.primary-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: end; }
@media (max-width: 640px) { .controls-grid { grid-template-columns: 1fr; } }
.swap-arrow {
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem; color: var(--text-dim); grid-column: 1 / -1; margin: -6px 0;
}
.slider-block { grid-column: 1 / -1; margin-top: 6px; }
.slider-row { display: flex; align-items: center; gap: 14px; }
input[type="range"] { flex: 1; accent-color: var(--accent-neutral); height: 28px; }
.slider-readout { min-width: 170px; text-align: right; font-weight: 700; font-size: 0.92rem; }
.slider-scale { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--text-dim); margin-top: 4px; }
.tolerance-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; grid-column: 1 / -1; }
.tolerance-row label { margin: 0; white-space: nowrap; }
.tolerance-row input { width: 84px; }

.tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.tab-btn {
  background: var(--bg); border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 8px; padding: 10px 14px; cursor: pointer; font-size: 0.88rem; font-weight: 600;
}
.tab-btn.active { background: var(--accent-neutral); color: #0b1220; border-color: var(--accent-neutral); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.target-summary { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 14px; }
.target-summary strong { color: var(--text); }

table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); }
th { color: var(--text-dim); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; }
tr:hover td { background: var(--bg-card-hover); }
.benefit-left  { color: var(--accent); font-weight: 700; }
.benefit-right { color: var(--accent2); font-weight: 700; }
.benefit-even  { color: var(--accent-neutral); font-weight: 700; }
.benefit-dash  { color: var(--text-dim); }
.diff-cell { color: var(--text-dim); font-size: 0.8rem; }
.qual-badge {
  display: inline-block; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.02em;
  padding: 2px 6px; border-radius: 5px; background: rgba(96,165,250,0.15); color: var(--accent-neutral);
  margin-left: 4px;
}
.empty-state, .status-line { color: var(--text-dim); font-size: 0.9rem; padding: 10px 0; }
.status-line.error { color: var(--danger); }

/* responsive table -> stacked cards below 700px, driven by data-label on <td> */
@media (max-width: 700px) {
  table.responsive-table thead { display: none; }
  table.responsive-table, table.responsive-table tbody, table.responsive-table tr, table.responsive-table td {
    display: block; width: 100%;
  }
  table.responsive-table tr {
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 10px;
    padding: 6px 10px;
    background: var(--bg-card);
  }
  table.responsive-table tr:hover td { background: transparent; }
  table.responsive-table td {
    border-bottom: none;
    padding: 7px 2px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  table.responsive-table td::before {
    content: attr(data-label);
    color: var(--text-dim);
    font-weight: 600;
    font-size: 0.7rem;
    text-transform: uppercase;
    flex-shrink: 0;
  }
}

/* type-ahead autocomplete */
.autocomplete-wrap { position: relative; }
.autocomplete-list {
  position: absolute; z-index: 20; top: calc(100% + 4px); left: 0; right: 0;
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
  max-height: 240px; overflow-y: auto; display: none;
}
.autocomplete-list.open { display: block; }
.autocomplete-item { padding: 12px 14px; cursor: pointer; font-size: 0.95rem; border-bottom: 1px solid var(--border); }
.autocomplete-item:last-child { border-bottom: none; }
.autocomplete-item:hover, .autocomplete-item.highlighted { background: var(--bg-card-hover); }
.autocomplete-item .sub { color: var(--text-dim); font-size: 0.78rem; }
.chosen-chip {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 20px;
  padding: 8px 8px 8px 14px; font-size: 0.9rem; margin-top: 8px;
}
.chosen-chip button { min-height: auto; background: none; color: var(--text-dim); font-size: 1rem; padding: 4px 8px; }
.giver-slot { margin-bottom: 12px; }
.giver-slot.disabled { opacity: 0.4; }
.opp-badge {
  display: inline-block; font-size: 0.72rem; color: var(--text-dim);
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; margin-bottom: 6px;
}

/* raw charts page */
.pos-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.search-sort-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.search-sort-row input[type="text"] { flex: 1; min-width: 160px; }
.search-sort-row select { width: auto; min-width: 140px; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:after { content: ' \\2195'; color: var(--text-dim); font-size: 0.7em; }

footer.sitenav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(15, 17, 21, 0.97);
  border-top: 1px solid var(--border);
  backdrop-filter: blur(6px);
  display: flex; justify-content: center; gap: 20px;
  padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
}
footer.sitenav a {
  color: var(--text-dim); text-decoration: none; font-size: 0.78rem;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 4px 14px; min-width: 76px;
}
footer.sitenav a.current { color: var(--accent-neutral); }
footer.sitenav a span.icon { font-size: 1.25rem; }

</style>
</head>
<body>

<header class="hero">
  <h1>📊 Raw Charts</h1>
  <p>Yahoo / Richards / Boone / FantasyPros trade values, side by side, unscaled</p>
</header>

<main>
  <section class="card">
    <div class="pos-tabs" id="posTabs">
      <button class="tab-btn active" data-pos="QB">QB</button>
      <button class="tab-btn" data-pos="RB">RB</button>
      <button class="tab-btn" data-pos="WR">WR</button>
      <button class="tab-btn" data-pos="TE">TE</button>
    </div>
    <div class="search-sort-row">
      <input type="text" id="searchBox" placeholder="Search player…">
      <select id="sortSelect">
        <option value="boone">Sort: Boone</option>
        <option value="yahoo">Sort: Yahoo</option>
        <option value="richards">Sort: Richards</option>
        <option value="fantasypros">Sort: FantasyPros</option>
        <option value="player">Sort: Name (A–Z)</option>
      </select>
    </div>
    <p class="status-line" id="statusLine">Loading charts…</p>
    <div id="tableWrap"></div>
  </section>
</main>

<footer class="sitenav">
  <a href="../trade-finder/index.html"><span class="icon">🔄</span>Trade Finder</a>
  <a href="../player-trade/index.html"><span class="icon">🎯</span>Player Trade</a>
  <a href="../raw-charts/index.html" class="current"><span class="icon">📊</span>Raw Charts</a>
</footer>

<script>
/* ──────────────────────────────────────────────────────────────────────────
   Raw Charts — read-only reference. Straight from
   ../data/raw_charts_latest.json, no trade math here at all.
   ────────────────────────────────────────────────────────────────────────── */

const DATA_URL = '../data/raw_charts_latest.json';
let DATA = null;
let currentPos = 'QB';
let sortKey = 'boone';
let searchQuery = '';

async function loadData() {
  const statusEl = document.getElementById('statusLine');
  try {
    const resp = await fetch(DATA_URL, { cache: 'no-store' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    DATA = await resp.json();
    statusEl.textContent = `Charts updated ${DATA.generated || 'unknown date'}.`;
    render();
  } catch (err) {
    statusEl.textContent = `Could not load chart data (${err.message}).`;
    statusEl.classList.add('error');
  }
}

function fmt(v) { return (v === null || v === undefined) ? '—' : v; }

function render() {
  if (!DATA) return;
  const rows = (DATA.positions && DATA.positions[currentPos]) ? [...DATA.positions[currentPos]] : [];

  const filtered = searchQuery
    ? rows.filter(r => r.player.toLowerCase().includes(searchQuery))
    : rows;

  filtered.sort((a, b) => {
    if (sortKey === 'player') return a.player.localeCompare(b.player);
    const av = a[sortKey], bv = b[sortKey];
    if (av === null || av === undefined) return 1;
    if (bv === null || bv === undefined) return -1;
    return bv - av; // descending for value columns
  });

  const wrap = document.getElementById('tableWrap');
  if (!filtered.length) {
    wrap.innerHTML = `<p class="empty-state">No ${currentPos}s match "${searchQuery}".</p>`;
    return;
  }

  const rowsHtml = filtered.map(r => {
    const nameCell = r.nfl_team ? `${r.player} (${r.nfl_team})` : r.player;
    return `<tr>
      <td data-label="Player">${nameCell}</td>
      <td data-label="Yahoo">${fmt(r.yahoo)}</td>
      <td data-label="Richards">${fmt(r.richards)}${r.richards_ceiling ? ' <span title="Richards did not rank this player — using his ≤4 ceiling, not a real rank" style="cursor:help;">†</span>' : ''}</td>
      <td data-label="Boone">${fmt(r.boone)}</td>
      <td data-label="FantasyPros">${fmt(r.fantasypros)}</td>
    </tr>`;
  }).join('');

  wrap.innerHTML = `
    <table class="responsive-table">
      <thead>
        <tr>
          <th>Player</th><th>Yahoo</th><th>Richards</th><th>Boone</th><th>FantasyPros</th>
        </tr>
      </thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
}

document.querySelectorAll('#posTabs .tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#posTabs .tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPos = btn.dataset.pos;
    render();
  });
});

document.getElementById('searchBox').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim().toLowerCase();
  render();
});

document.getElementById('sortSelect').addEventListener('change', (e) => {
  sortKey = e.target.value;
  render();
});

loadData();
</script>

</body>
</html>
