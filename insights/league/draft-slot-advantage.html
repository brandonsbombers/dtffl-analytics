<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DTFFL Insights &middot; Draft slot advantage</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0f172a; color: #e2e8f0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  max-width: 480px; margin: 0 auto;
  padding-bottom: calc(56px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust: 100%;
}
.pg-header { position: sticky; top: 0; z-index: 10; background: #0f172a; border-bottom: 1px solid #1e293b; padding: 14px 16px 10px; }
.pg-title { font-size: 18px; font-weight: 700; color: #f8fafc; line-height: 1.2; }
.pg-sub   { font-size: 12px; color: #64748b; margin-top: 3px; }
.hero { padding: 24px 16px 16px; border-bottom: 1px solid #1e293b; }
.hero-title { font-size: 26px; font-weight: 800; color: #f8fafc; line-height: 1.1; }
.hero-sub { font-size: 13px; color: #64748b; margin-top: 5px; }
.sec-label, .section-hd { padding: 14px 16px 6px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #475569; }
.section-hd { border-top: 1px solid #1e293b; margin-top: 6px; }
.section-note { padding: 0 16px 8px; font-size: 11px; color: #64748b; }
.link-list { padding: 0 12px; }
.link-row { display: flex; align-items: center; gap: 12px; padding: 12px 8px; border-bottom: 1px solid #1e293b; text-decoration: none; color: inherit; }
.link-row:last-child { border-bottom: none; }
.link-row:active { background: #1e293b; border-radius: 8px; }
.link-row.disabled { opacity: 0.4; pointer-events: none; }
.link-icon { font-size: 20px; flex-shrink: 0; }
.link-title { font-size: 14px; font-weight: 600; color: #f1f5f9; }
.link-meta { font-size: 11px; color: #64748b; margin-top: 2px; }
.link-arr { margin-left: auto; color: #334155; font-size: 16px; flex-shrink: 0; }
.soon-tag { margin-left: auto; font-size: 10px; color: #475569; background: #1e293b; padding: 2px 8px; border-radius: 99px; }
.select-wrap { padding: 12px 16px 4px; }
select.insights-select {
  width: 100%; background: #1e293b; border: 1px solid #334155; color: #f1f5f9;
  font-size: 14px; font-weight: 600; padding: 10px 12px; border-radius: 10px;
  -webkit-appearance: none; appearance: none;
}
.comp-bar-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
.comp-label { width: 44px; font-size: 12px; font-weight: 700; color: #94a3b8; flex-shrink: 0; }
.comp-track { flex: 1; height: 16px; background: #1e293b; border-radius: 4px; overflow: hidden; }
.comp-fill { height: 100%; border-radius: 4px; }
.comp-pct { width: 42px; text-align: right; font-size: 12px; color: #f1f5f9; font-weight: 600; flex-shrink: 0; }
.legend { display: flex; gap: 14px; padding: 0 16px 8px; font-size: 11px; color: #94a3b8; }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 9px; height: 9px; border-radius: 50%; }
.pick-list { padding: 4px 16px; }
.pick-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #1e293b; font-size: 13px; }
.pick-row:last-child { border-bottom: none; }
.pick-name { color: #f1f5f9; font-weight: 600; }
.pick-meta { color: #64748b; font-size: 11px; margin-top: 1px; }
.pick-val { font-weight: 700; }
.pick-val.reach { color: #f87171; }
.pick-val.value { color: #4ade80; }
.pick-val.na { color: #475569; font-weight: 400; }
table.heatmap { border-collapse: collapse; font-size: 10px; width: 100%; }
table.heatmap th { color: #64748b; font-weight: 600; padding: 4px 3px; text-align: center; }
table.heatmap td { text-align: center; padding: 6px 3px; color: #0f172a; font-weight: 700; border-radius: 3px; }
table.heatmap td.rd { color: #475569; font-weight: 600; background: none; text-align: left; padding-left: 4px; }
table.heatmap td.empty { background: #1e293b; color: #334155; font-weight: 400; }
.pg-footer, .footer { padding: 20px 16px 40px; font-size: 11px; color: #334155; text-align: center; }
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #0f172a; border-top: 1px solid #1e293b; display: flex; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
.nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 0 6px; text-decoration: none; color: #475569; font-size: 10px; font-weight: 600; letter-spacing: .03em; gap: 3px; -webkit-tap-highlight-color: transparent; }
.nav-tab:active { background: #1e293b; }
.nav-tab.active { color: #4ade80; }
.nav-icon { font-size: 18px; line-height: 1; }
</style></head><body>

<div class="pg-header">
  <div class="pg-title">Draft slot advantage</div>
  <div class="pg-sub">Where champions actually picked in round 1</div>
</div>
<div id="slotSummary" style="padding:12px 16px"><div style="font-size:12px;color:#475569">Loading&hellip;</div></div>
<div class="section-hd">Win rate by slot bucket</div>
<div class="section-note">Championships in that bucket, vs. how often teams sit there at all</div>
<div id="winRateBars" style="padding:4px 16px 8px"></div>
<div class="section-hd">Champion-by-champion</div>
<div id="champList" style="padding:4px 16px 24px"></div>

<nav class="bottom-nav"><a class="nav-tab" href="../index.html"><span class="nav-icon">🏠</span>Home</a><a class="nav-tab active" href="index.html"><span class="nav-icon">🏆</span>League</a><a class="nav-tab" href="../team.html"><span class="nav-icon">👥</span>Teams</a></nav>

<script>
async function loadJSON(path) { const r = await fetch(path); if (!r.ok) throw new Error(path); return r.json(); }
(async function() {
  const summaryEl = document.getElementById('slotSummary');
  const winRateEl = document.getElementById('winRateBars');
  const listEl = document.getElementById('champList');
  let champions, history;
  try {
    [champions, history] = await Promise.all([
      loadJSON('../../data/dtffl_champions_latest.json'),
      loadJSON('../../data/dtffl_draft_history_all_seasons_latest.json'),
    ]);
  } catch (e) {
    summaryEl.innerHTML = '<div style="font-size:12px;color:#f87171">Could not load champions or draft history.</div>';
    return;
  }

  const usable = champions.filter(c => c.Has_Draft_Data === 'Yes');

  function teamCountForSeason(season) {
    return Math.max(...history.filter(r => r.Season === season && r.Round === 1).map(r => r.Pick_In_Round));
  }
  function bucketFor(pick, teamCount) {
    const third = Math.ceil(teamCount / 3);
    if (pick <= third) return 'Early';
    if (pick > teamCount - third) return 'Late';
    return 'Middle';
  }

  // Champion-by-champion: find each champion's actual round-1 pick that season
  const champRows = usable.map(c => {
    const pickRow = history.find(r => r.Season === c.Year && r.Owner_ID === c.Owner_ID && r.Round === 1);
    const teamCount = teamCountForSeason(c.Year);
    const pick = pickRow ? pickRow.Pick_In_Round : null;
    const bucket = pick ? bucketFor(pick, teamCount) : null;
    return { year: c.Year, team: c.Team_Name, owner: c.Owner_Name, pick, teamCount, bucket };
  });

  const bucketCounts = { Early: 0, Middle: 0, Late: 0 };
  champRows.forEach(c => { if (c.bucket) bucketCounts[c.bucket]++; });

  summaryEl.innerHTML = ['Early', 'Middle', 'Late'].map(b =>
    '<span class="legend-item" style="margin-right:18px"><span style="font-weight:700;color:#f1f5f9">' + bucketCounts[b] + '</span>&nbsp;' + b + '</span>'
  ).join('') + '<div class="section-note" style="padding:6px 0 0">out of ' + champRows.length + ' seasons with draft data</div>';

  // Win rate by bucket: championships in bucket / total team-seasons in that bucket, across all teams+seasons
  const seasons = [...new Set(usable.map(c => c.Year))];
  const teamSeasonBucketCounts = { Early: 0, Middle: 0, Late: 0 };
  seasons.forEach(season => {
    const teamCount = teamCountForSeason(season);
    history.filter(r => r.Season === season && r.Round === 1).forEach(r => {
      const b = bucketFor(r.Pick_In_Round, teamCount);
      teamSeasonBucketCounts[b]++;
    });
  });

  let barsHtml = '';
  ['Early', 'Middle', 'Late'].forEach(b => {
    const total = teamSeasonBucketCounts[b] || 1;
    const pct = (bucketCounts[b] / total * 100).toFixed(0);
    barsHtml += '<div style="margin-bottom:10px">' +
      '<div style="display:flex;justify-content:space-between;font-size:12px;color:#94a3b8;margin-bottom:3px"><span style="font-weight:700;color:#f1f5f9">' + b + '</span><span>' + bucketCounts[b] + ' of ' + total + ' team-seasons &middot; ' + pct + '%</span></div>' +
      '<div style="background:#1e293b;border-radius:4px;height:14px;overflow:hidden"><div style="width:' + pct + '%;height:100%;background:#4ade80"></div></div>' +
      '</div>';
  });
  winRateEl.innerHTML = barsHtml;

  listEl.innerHTML = champRows.map(c =>
    '<div class="pick-row"><div><div class="pick-name">' + c.year + ' &middot; ' + c.team + '</div>' +
    '<div class="pick-meta">' + c.owner + '</div></div>' +
    '<div class="pick-val">' + (c.pick ? ('Pick ' + c.pick + ' of ' + c.teamCount + ' &middot; ' + c.bucket) : 'No round-1 pick found') + '</div></div>'
  ).join('');
})();
</script>

</body></html>
